```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verification | MangoLearning</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fa;

            color: #182230;
        }

        .card {
            width: 90%;
            max-width: 430px;

            padding: 42px;

            text-align: center;

            background: white;

            border: 1px solid #e2e7ee;

            border-radius: 20px;

            box-shadow:
                0 25px 70px
                rgba(20, 30, 45, .10);
        }

        .icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #eef3ff;

            font-size: 28px;
        }

        h1 {
            margin: 0 0 12px;

            font-size: 30px;

            letter-spacing: -1px;
        }

        p {
            color: #718092;

            font-size: 14px;

            line-height: 1.6;
        }

        .status {
            margin-top: 25px;

            padding: 13px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 700;
        }

        .success {
            background: #eaf8ef;
            color: #237a45;
        }

        .failure {
            background: #fff0ef;
            color: #b42318;
        }

        .button {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 20px;

            border-radius: 8px;

            background: #182230;

            color: white;

            font-size: 13px;

            font-weight: 700;
        }

    </style>

</head>


<body>


<div class="card">

    <div class="icon">
        ✓
    </div>

    <h1>
        Verifying access
    </h1>

    <p id="description">
        Checking where you came from...
    </p>

    <div id="status"
         class="status">
    </div>

    <a
        id="continueButton"
        class="button"
        href="index.html"
        style="display:none;">

        Continue →

    </a>

</div>



<script>

    /*
     * Only allow visitors whose referrer
     * is mathpy.vercel.app
     */

    const allowedHost = "mathpy.vercel.app";


    const referrer =
        document.referrer;


    const status =
        document.getElementById("status");


    const description =
        document.getElementById("description");


    const continueButton =
        document.getElementById("continueButton");


    let cameFromMathPy = false;


    try {

        if (referrer) {

            const referrerURL =
                new URL(referrer);

            cameFromMathPy =
                referrerURL.hostname === allowedHost;

        }

    } catch (error) {

        cameFromMathPy = false;

    }


    if (cameFromMathPy) {

        status.textContent =
            "✓ Verification successful";

        status.classList.add("success");

        description.textContent =
            "Your visit originated from mathpy.vercel.app.";

        continueButton.style.display =
            "inline-block";

    }

    else {

        status.textContent =
            "✕ Verification failed";

        status.classList.add("failure");

        description.textContent =
            "This page can only be accessed from mathpy.vercel.app.";

    }

</script>


</body>

</html>
